  - changeSet:
      id: v1.0.3-01-seed-question-bank
      author: team
      context: demo
      comment: "Ngân hàng câu hỏi + 9 câu trắc nghiệm và 1 câu tự luận. Đây là nguồn để chọn câu khi tạo đề."
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ";"
            sql: |
              INSERT INTO QuestionBanks (BankID, Title, LevelID, TeacherID)
              VALUES (9001, 'Ngân hàng N4 – Ngữ pháp cơ bản (demo)', 9001, 'demo-teacher-01');

              INSERT INTO Questions (QuestionID, BankID, Content, QuestionType, DifficultyLevel, Explanation, IsDeleted) VALUES
                (9001, 9001, N'「毎日 日本語を＿＿＿。」Chọn dạng đúng của động từ.', 'MULTIPLE_CHOICE', 1, N'Thói quen hằng ngày dùng thể lịch sự hiện tại.', false),
                (9002, 9001, N'「わたし＿＿＿ 学生です。」Chọn trợ từ đúng.', 'MULTIPLE_CHOICE', 1, N'「は」đánh dấu chủ đề của câu.', false),
                (9003, 9001, N'「きのう 映画を＿＿＿。」Chọn thể quá khứ.', 'MULTIPLE_CHOICE', 1, N'「きのう」là mốc quá khứ nên động từ chia thể ました.', false),
                (9004, 9001, N'「この 本は おもしろい＿＿＿ です。」Chọn từ điền vào.', 'MULTIPLE_CHOICE', 2, N'Mẫu 〜そうです diễn tả suy đoán qua vẻ ngoài.', false),
                (9005, 9001, N'「あした 雨が ふる＿＿＿ おもいます。」Chọn từ nối.', 'MULTIPLE_CHOICE', 2, N'「と思います」dùng để nêu ý kiến.', false),
                (9006, 9001, N'「たばこを ＿＿＿は いけません。」Chọn dạng đúng.', 'MULTIPLE_CHOICE', 2, N'Mẫu 〜てはいけません = cấm làm gì.', false),
                (9007, 9001, N'「日本へ 行った＿＿＿ が ありますか。」Chọn từ điền vào.', 'MULTIPLE_CHOICE', 3, N'Mẫu 〜たことがあります = từng làm gì.', false),
                (9008, 9001, N'「先生に ほめ＿＿＿。」Chọn thể bị động.', 'MULTIPLE_CHOICE', 3, N'Thể bị động của ほめる là ほめられる.', false),
                (9009, 9001, N'「お金が あれば、車を ＿＿＿。」Chọn dạng đúng.', 'MULTIPLE_CHOICE', 3, N'Mẫu điều kiện 〜ば đi với ý muốn / khả năng.', false),
                (9010, 9001, N'Viết một đoạn 3–5 câu giới thiệu về bản thân bằng tiếng Nhật (tên, tuổi, nghề nghiệp, sở thích).', 'ESSAY', 2, N'Câu tự luận: cần giáo viên chấm tay.', false);
