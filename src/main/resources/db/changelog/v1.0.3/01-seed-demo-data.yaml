  - changeSet:
      id: v1.0.3-01-seed-exams
      author: team
      context: demo
      comment: >-
        Năm đề thi phủ đủ năm trạng thái mà ExamResponse.Availability sinh ra:
        OPEN, OPEN (tự luyện, không gán lớp), UPCOMING, CLOSED, NO_QUESTIONS.
        Thời gian tính tương đối theo NOW() nên nạp lúc nào cũng đúng trạng thái.
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ";"
            sql: |
              INSERT INTO Exams (ExamID, ClassID, LevelID, CreatedBy, Title, DurationMinutes, StartTime, EndTime, IsAdaptive) VALUES
                (9001, 9001, 9001, 'demo-teacher-01', N'Đề mẫu N4 – đang mở (demo)', 20,
                 DATE_SUB(NOW(), INTERVAL 1 DAY), DATE_ADD(NOW(), INTERVAL 7 DAY), false),
                (9002, NULL, 9001, 'demo-teacher-01', N'Đề tự luyện N4 – không gán lớp (demo)', 15,
                 DATE_SUB(NOW(), INTERVAL 1 DAY), DATE_ADD(NOW(), INTERVAL 30 DAY), true),
                (9003, 9001, 9001, 'demo-teacher-01', N'Đề sắp diễn ra (demo)', 30,
                 DATE_ADD(NOW(), INTERVAL 2 DAY), DATE_ADD(NOW(), INTERVAL 9 DAY), false),
                (9004, 9001, 9001, 'demo-teacher-01', N'Đề đã hết hạn (demo)', 30,
                 DATE_SUB(NOW(), INTERVAL 10 DAY), DATE_SUB(NOW(), INTERVAL 1 DAY), false),
                (9005, 9001, 9001, 'demo-teacher-01', N'Đề chưa gắn câu hỏi (demo)', 25,
                 DATE_SUB(NOW(), INTERVAL 1 DAY), DATE_ADD(NOW(), INTERVAL 7 DAY), false);

  - changeSet:
      id: v1.0.3-01-seed-exam-questions
      author: team
      context: demo
      comment: >-
        Gắn câu hỏi vào đề, KÈM snapshot nội dung — đúng như ExamSnapshotService
        làm khi giáo viên bấm thêm câu hỏi. Thiếu snapshot thì phòng thi phải
        fallback về Questions sống, nên seed luôn để test đúng đường chính.
        Đề 9005 cố tình để trống để test trạng thái NO_QUESTIONS.
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ";"
            sql: |
              INSERT INTO ExamQuestions (ExamID, QuestionID, QuestionOrder, Points,
                                         QuestionContent, QuestionType, DifficultyLevel, Explanation, SnapshotAt)
              SELECT e.ExamID, q.QuestionID,
                     ROW_NUMBER() OVER (PARTITION BY e.ExamID ORDER BY q.QuestionID),
                     CASE WHEN q.QuestionType = 'ESSAY' THEN 2.00 ELSE 1.00 END,
                     q.Content, q.QuestionType, q.DifficultyLevel, q.Explanation, NOW()
              FROM Questions q
              CROSS JOIN (SELECT 9001 AS ExamID UNION ALL SELECT 9002
                          UNION ALL SELECT 9003 UNION ALL SELECT 9004) e
              WHERE (e.ExamID = 9001 AND q.QuestionID IN (9001, 9002, 9003, 9004, 9005, 9010))
                 OR (e.ExamID = 9002 AND q.QuestionID IN (9006, 9007, 9008, 9009))
                 OR (e.ExamID = 9003 AND q.QuestionID IN (9001, 9006, 9007))
                 OR (e.ExamID = 9004 AND q.QuestionID IN (9002, 9008, 9009));

              INSERT INTO ExamQuestionAnswers (ExamID, QuestionID, OriginalAnswerID, AnswerContent, IsCorrect, AnswerOrder)
              SELECT eq.ExamID, a.QuestionID, a.AnswerID, a.AnswerContent, a.IsCorrect,
                     ROW_NUMBER() OVER (PARTITION BY eq.ExamID, a.QuestionID ORDER BY a.AnswerID)
              FROM ExamQuestions eq
              JOIN Answers a ON a.QuestionID = eq.QuestionID
              WHERE eq.ExamID BETWEEN 9001 AND 9005;

