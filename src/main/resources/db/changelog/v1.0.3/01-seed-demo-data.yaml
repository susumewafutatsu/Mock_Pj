databaseChangeLog:
  # ─────────────────────────────────────────────────────────────────
  # DỮ LIỆU MẪU ĐỂ TEST — KHÔNG CHẠY MẶC ĐỊNH.
  #
  # Mọi changeSet ở đây đều mang context "demo", nên chỉ nạp khi bật:
  #   spring.liquibase.contexts=demo
  # hoặc chạy app với: --spring.liquibase.contexts=demo
  # Không bật thì Liquibase bỏ qua toàn bộ file này.
  #
  # ID được đặt trong dải 9001+ để không đụng dữ liệu tự tăng có sẵn
  # trên DB dev của bạn. Email dùng đuôi @demo.local cho dễ nhận.
  #
  # Mật khẩu của mọi tài khoản mẫu: demo1234
  # (hash BCrypt bên dưới đã kiểm tra khớp với BCryptPasswordEncoder
  #  mà SecurityConfig đang dùng.)
  # ─────────────────────────────────────────────────────────────────

