                (32, '難しい', 'むずかしい',   'khó',                  'Tính từ đuôi i',  1, '漢字は難しいです。',     'Chữ Hán thì khó.'),
                (33, '易しい', 'やさしい',     'dễ',                   'Tính từ đuôi i',  1, 'この問題は易しいです。', 'Bài này dễ.'),
                (34, '元気',   'げんき',       'khoẻ mạnh',            'Tính từ đuôi na', 1, 'お元気ですか。',         'Bạn có khoẻ không?'),
                (35, '静か',   'しずか',       'yên tĩnh',             'Tính từ đuôi na', 1, 'この町は静かです。',     'Thị trấn này yên tĩnh.'),
                (36, '便利',   'べんり',       'tiện lợi',             'Tính từ đuôi na', 1, '地下鉄は便利です。',     'Tàu điện ngầm rất tiện.'),
                (37, '好き',   'すき',         'thích',                'Tính từ đuôi na', 1, '音楽が好きです。',       'Tôi thích âm nhạc.'),
                (38, '電車',   'でんしゃ',     'tàu điện',             'Danh từ', 1, '電車で行きます。',              'Tôi đi bằng tàu điện.'),
                (39, '病院',   'びょういん',   'bệnh viện',            'Danh từ', 1, '病院へ行きました。',            'Tôi đã đến bệnh viện.'),
                (40, '天気',   'てんき',       'thời tiết',            'Danh từ', 1, '今日はいい天気です。',          'Hôm nay thời tiết đẹp.');
      rollback:
        - sql:
            sql: DELETE FROM VocabItems WHERE VocabID BETWEEN 1 AND 999

  - changeSet:
      id: v1.4.0-03-seed-kanji-n5
      author: team
      comment: >-
        20 chữ Hán N5 đầu tiên. Onyomi ghi bằng katakana và Kunyomi bằng
        hiragana theo đúng quy ước từ điển Nhật — người học quen mắt với
        cách trình bày đó, đổi đi là gây nhầm âm On với âm Kun.
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM KanjiItems WHERE KanjiID BETWEEN 1 AND 999
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ";"
            sql: |
              INSERT INTO KanjiItems
                (KanjiID, Glyph, Onyomi, Kunyomi, Meaning, StrokeCount, Radical, LevelID, Mnemonic) VALUES
                (1,  '日', 'ニチ、ジツ',   'ひ、か',        'nhật — ngày, mặt trời',        4,  '日', 1, 'Hình mặt trời có một chấm ở giữa.'),
                (2,  '月', 'ゲツ、ガツ',   'つき',          'nguyệt — tháng, mặt trăng',    4,  '月', 1, 'Hình vầng trăng khuyết.'),
                (3,  '火', 'カ',           'ひ',            'hoả — lửa',                    4,  '火', 1, 'Ngọn lửa với hai tia bắn sang hai bên.'),
                (4,  '水', 'スイ',         'みず',          'thuỷ — nước',                  4,  '水', 1, 'Dòng nước chảy toả ra hai bên.'),
                (5,  '木', 'モク、ボク',   'き',            'mộc — cây, gỗ',                4,  '木', 1, 'Cái cây có thân, cành và rễ.'),
                (6,  '金', 'キン、コン',   'かね',          'kim — vàng, tiền, kim loại',   8,  '金', 1, 'Kim loại quý cất dưới mái nhà.'),
                (7,  '土', 'ド、ト',       'つち',          'thổ — đất',                    3,  '土', 1, 'Mầm cây nhú lên khỏi mặt đất.'),
                (8,  '人', 'ジン、ニン',   'ひと',          'nhân — người',                 2,  '人', 1, 'Hình một người đang bước đi.'),
                (9,  '山', 'サン',         'やま',          'sơn — núi',                    3,  '山', 1, 'Ba đỉnh núi nhô lên.'),
                (10, '川', 'セン',         'かわ',          'xuyên — sông',                 3,  '川', 1, 'Ba dòng nước chảy song song.'),
                (11, '大', 'ダイ、タイ',   'おお',          'đại — to lớn',                 3,  '大', 1, 'Người dang rộng hai tay.'),
                (12, '小', 'ショウ',       'ちい、こ',      'tiểu — nhỏ',                   3,  '小', 1, 'Một vật nhỏ bị chia làm ba phần.'),
                (13, '上', 'ジョウ',       'うえ、あ',      'thượng — trên',                3,  '一', 1, 'Vạch nhô lên phía trên đường ngang.'),
                (14, '下', 'カ、ゲ',       'した、さ',      'hạ — dưới',                    3,  '一', 1, 'Vạch thõng xuống phía dưới đường ngang.'),
                (15, '中', 'チュウ',       'なか',          'trung — giữa, ở trong',        4,  '丨', 1, 'Một nét xuyên qua chính giữa khung.'),
                (16, '学', 'ガク',         'まな',          'học',                          8,  '子', 1, 'Đứa trẻ ngồi dưới mái trường.'),
                (17, '生', 'セイ、ショウ', 'い、う、なま',  'sinh — sống, sinh ra, tươi',   5,  '生', 1, 'Mầm cây mọc lên từ mặt đất.'),
                (18, '先', 'セン',         'さき',          'tiên — trước, đầu tiên',       6,  '儿', 1, 'Người bước lên phía trước.'),
                (19, '年', 'ネン',         'とし',          'niên — năm',                   6,  '干', 1, 'Bó lúa gặt mỗi năm một lần.'),
                (20, '時', 'ジ',           'とき',          'thời — thời gian, giờ',        10, '日', 1, 'Mặt trời bên cạnh ngôi đền dùng để đo giờ.');
      rollback:
        - sql:
            sql: DELETE FROM KanjiItems WHERE KanjiID BETWEEN 1 AND 999

  - changeSet:
      id: v1.4.0-03-seed-decks-n5
