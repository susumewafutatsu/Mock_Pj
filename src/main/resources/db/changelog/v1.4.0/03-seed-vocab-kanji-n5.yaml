databaseChangeLog:
  # ─────────────────────────────────────────────────────────────────
  # NỘI DUNG HỌC N5 — CHẠY MẶC ĐỊNH (không có context "demo").
  #
  # Khác các file seed dữ liệu mẫu: đây KHÔNG phải dữ liệu để test mà là
  # nội dung học thật của sản phẩm, giống bộ môn học / trình độ ở v1.0.4.
  # Bắt giáo viên gõ tay 800 từ N5 qua UI là chuyện không xảy ra, nên
  # nội dung nền phải đi kèm hệ thống.
  #
  # ID cố định trong dải 1..999 để mọi máy trong team dùng cùng con số.
  # Dải 9001+ vẫn thuộc về dữ liệu demo như quy ước cũ.
  #
  # LevelID = 1 là N5 (xem v1.0.4/01-seed-catalog.yaml).
  #
  # ⚠ HAI ĐIỀU KHÔNG ĐƯỢC LÀM VỚI FILE NÀY — cả hai đều đã xảy ra một lần:
  #
  # 1. KHÔNG sửa nội dung changeSet sau khi nó đã chạy ở đâu đó. Liquibase
  #    lưu checksum của từng changeSet; đổi dù chỉ một dấu phẩy trong chú
  #    thích cũng làm app từ chối khởi động với "Validation Failed: checksum".
  #    Muốn đổi nội dung thì thêm changeSet MỚI, không sửa cái cũ.
  #
  # 2. KHÔNG tìm-thay hàng loạt thuật ngữ ứng dụng lên file này. Cột Meaning
  #    là NGHĨA TỪ ĐIỂN, không phải nhãn giao diện. Một lần đổi "học sinh"
  #    thành "thí sinh" trên toàn dự án đã biến 学生 (gakusei = học sinh)
  #    thành "thí sinh" và 先生 (sensei = giáo viên) thành "người ra đề" —
  #    sai nghĩa, và người học sẽ học thuộc cái sai đó.
  # ─────────────────────────────────────────────────────────────────

  - changeSet:
      id: v1.4.0-03-seed-vocab-n5
      author: team
      comment: "40 từ vựng N5: danh từ, động từ, tính từ thường gặp nhất, kèm câu ví dụ."
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM VocabItems WHERE VocabID BETWEEN 1 AND 999
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ";"
            sql: |
              INSERT INTO VocabItems
                (VocabID, Word, Reading, Meaning, PartOfSpeech, LevelID, ExampleSentence, ExampleMeaning) VALUES
                (1,  '学生',   'がくせい',     'học sinh, sinh viên',  'Danh từ', 1, 'わたしは学生です。',            'Tôi là sinh viên.'),
                (2,  '先生',   'せんせい',     'giáo viên',            'Danh từ', 1, '先生はきょうしつにいます。',    'Thầy giáo đang ở trong lớp.'),
                (3,  '学校',   'がっこう',     'trường học',           'Danh từ', 1, 'まいにち学校へ行きます。',      'Hằng ngày tôi đến trường.'),
                (4,  '友達',   'ともだち',     'bạn bè',               'Danh từ', 1, '友達と映画を見ます。',          'Tôi xem phim với bạn.'),
                (5,  '家族',   'かぞく',       'gia đình',             'Danh từ', 1, '家族は四人です。',              'Gia đình tôi có bốn người.'),
                (6,  '会社',   'かいしゃ',     'công ty',              'Danh từ', 1, '父は会社で働いています。',      'Bố tôi làm việc ở công ty.'),
                (7,  '時間',   'じかん',       'thời gian',            'Danh từ', 1, '時間がありません。',            'Tôi không có thời gian.'),
                (8,  '今日',   'きょう',       'hôm nay',              'Danh từ', 1, '今日は暑いです。',              'Hôm nay trời nóng.'),
                (9,  '明日',   'あした',       'ngày mai',             'Danh từ', 1, '明日また来ます。',              'Ngày mai tôi lại đến.'),
                (10, '毎日',   'まいにち',     'hằng ngày',            'Danh từ', 1, '毎日日本語を勉強します。',      'Hằng ngày tôi học tiếng Nhật.'),
                (11, '食べる', 'たべる',       'ăn',                   'Động từ', 1, '朝ごはんを食べます。',          'Tôi ăn sáng.'),
                (12, '飲む',   'のむ',         'uống',                 'Động từ', 1, '水を飲みます。',                'Tôi uống nước.'),
                (13, '見る',   'みる',         'xem, nhìn',            'Động từ', 1, 'テレビを見ます。',              'Tôi xem tivi.'),
                (14, '聞く',   'きく',         'nghe, hỏi',            'Động từ', 1, '音楽を聞きます。',              'Tôi nghe nhạc.'),
                (15, '読む',   'よむ',         'đọc',                  'Động từ', 1, '本を読みます。',                'Tôi đọc sách.'),
                (16, '書く',   'かく',         'viết',                 'Động từ', 1, '手紙を書きます。',              'Tôi viết thư.'),
                (17, '話す',   'はなす',       'nói chuyện',           'Động từ', 1, '日本語で話します。',            'Tôi nói bằng tiếng Nhật.'),
                (18, '行く',   'いく',         'đi',                   'Động từ', 1, '東京へ行きます。',              'Tôi đi Tokyo.'),
                (19, '来る',   'くる',         'đến',                  'Động từ', 1, '友達が来ます。',                'Bạn tôi đến.'),
                (20, '帰る',   'かえる',       'trở về',               'Động từ', 1, '家へ帰ります。',                'Tôi về nhà.'),
                (21, '買う',   'かう',         'mua',                  'Động từ', 1, 'パンを買います。',              'Tôi mua bánh mì.'),
                (22, '働く',   'はたらく',     'làm việc',             'Động từ', 1, '銀行で働きます。',              'Tôi làm việc ở ngân hàng.'),
                (23, '休む',   'やすむ',       'nghỉ',                 'Động từ', 1, '今日は休みます。',              'Hôm nay tôi nghỉ.'),
