        theo loại từ để người mới có lối vào rõ ràng; bộ thứ năm trộn cả từ
        vựng lẫn kanji, đúng như một bài học thật — và cũng là bằng chứng
        DeckItems chứa được hai loại thẻ trong một bộ.
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM Decks WHERE DeckID BETWEEN 1 AND 999
