databaseChangeLog:
  # ─────────────────────────────────────────────────────────────────
  # TỪ VỰNG · KANJI · BỘ THẺ · LỊCH LẶP LẠI NGẮT QUÃNG (SRS) — §3.4(b)
  #
  # Đây là nghiệp vụ HỌC, tách hẳn khỏi nghiệp vụ THI. Không có bảng nào
  # ở đây dính tới Exams/Submissions: học thuộc từ vựng là việc diễn ra
  # hằng ngày, không cần và không nên đi qua một phiên thi.
  #
  # Vì sao cần SRS chứ không phải một danh sách từ để đọc lại: học JLPT
  # về bản chất là thuộc 800 (N5) đến 10.000 (N1) từ. Đọc lại cả danh
  # sách mỗi ngày là bất khả thi; thuật toán giãn cách chọn ra đúng những
  # thẻ sắp quên để ôn hôm nay. Toàn bộ trạng thái đó nằm ở UserCardStates.
  #
  # Ghi chú về tên cột Glyph (thay vì Character): CHARACTER là từ khoá
  # dành riêng của MySQL, đặt tên cột như vậy là phải quote ở mọi câu
  # lệnh. Đổi tên rẻ hơn nhiều so với việc nhớ quote mãi mãi.
  # ─────────────────────────────────────────────────────────────────

  - changeSet:
      id: v1.4.0-02-create-vocab-items
      author: team
      comment: "Từ vựng tiếng Nhật: chữ viết, cách đọc kana, nghĩa, câu ví dụ."
      changes:
        - createTable:
            tableName: VocabItems
            columns:
              - column:
                  name: VocabID
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              # Dạng viết thường gặp: có thể có kanji (食べる) hoặc thuần kana (たべる)
              - column:
                  name: Word
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              # Cách đọc bằng kana. Luôn bắt buộc — kể cả khi Word đã là kana,
              # vì màn ôn thẻ và phần so đáp án gõ tay đều dựa vào cột này.
              - column:
                  name: Reading
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: Meaning
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: PartOfSpeech
                  type: VARCHAR(30)
              - column:
                  name: LevelID
                  type: INT
                  constraints:
                    foreignKeyName: fk_vocab_level
                    references: SubjectLevels(LevelID)
              - column:
                  name: ExampleSentence
                  type: VARCHAR(500)
              - column:
                  name: ExampleMeaning
                  type: VARCHAR(500)
              # Audio phát trong màn ôn thẻ. Khác đề nghe của phần thi: thẻ
              # không giới hạn số lần phát, học thì nghe bao nhiêu lần cũng được.
              - column:
                  name: AudioURL
                  type: VARCHAR(255)
              - column:
                  name: CreatedAt
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP

        # Cùng một chữ viết có thể có hai cách đọc mang nghĩa khác nhau
        # (今日 = きょう "hôm nay" / こんにち "ngày nay"), nên khoá là cặp
        # Word + Reading chứ không riêng Word.
        - addUniqueConstraint:
            tableName: VocabItems
            columnNames: Word, Reading
            constraintName: UC_Vocab_Word_Reading

        - createIndex:
            tableName: VocabItems
            indexName: idx_vocab_level
            columns:
              - column:
                  name: LevelID

  - changeSet:
      id: v1.4.0-02-create-kanji-items
      author: team
      comment: "Chữ Hán: âm On/Kun, nghĩa, số nét, bộ thủ, mẹo nhớ."
      changes:
        - createTable:
            tableName: KanjiItems
            columns:
              - column:
                  name: KanjiID
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              # Một chữ Hán, nhưng để VARCHAR(8) chứ không phải (1): vài chữ
              # nằm ngoài mặt phẳng cơ bản của Unicode chiếm nhiều hơn một đơn vị.
              - column:
                  name: Glyph
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: UC_Kanji_Glyph
              # 音読み — âm Hán Nhật, ghi bằng katakana theo quy ước từ điển
              - column:
                  name: Onyomi
                  type: VARCHAR(100)
              # 訓読み — âm thuần Nhật, ghi bằng hiragana
              - column:
                  name: Kunyomi
                  type: VARCHAR(100)
              - column:
                  name: Meaning
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: StrokeCount
                  type: INT
              - column:
                  name: Radical
                  type: VARCHAR(8)
              - column:
                  name: LevelID
                  type: INT
                  constraints:
                    foreignKeyName: fk_kanji_level
                    references: SubjectLevels(LevelID)
              - column:
                  name: Mnemonic
                  type: VARCHAR(500)
              - column:
                  name: CreatedAt
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP

        - createIndex:
            tableName: KanjiItems
            indexName: idx_kanji_level
            columns:
              - column:
                  name: LevelID

  - changeSet:
      id: v1.4.0-02-create-decks
      author: team
      comment: "Bộ thẻ: nhóm từ vựng/kanji học cùng nhau. OwnerID NULL = bộ của hệ thống."
      changes:
        - createTable:
            tableName: Decks
            columns:
              - column:
                  name: DeckID
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: Name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: Description
                  type: VARCHAR(255)
              - column:
                  name: LevelID
                  type: INT
                  constraints:
                    foreignKeyName: fk_deck_level
                    references: SubjectLevels(LevelID)
              # NULL = bộ thẻ dựng sẵn của hệ thống, ai cũng học được.
              # Khác NULL = bộ do một người tự tạo.
              - column:
                  name: OwnerID
                  type: VARCHAR(50)
                  constraints:
                    foreignKeyName: fk_deck_owner
                    references: Users(UserID)
                    deleteCascade: true
              - column:
                  name: IsPublic
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: CreatedAt
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP

  - changeSet:
      id: v1.4.0-02-create-deck-items
      author: team
      comment: >-
        Thẻ trong bộ. ItemID là tham chiếu đa hình (VocabItems hoặc KanjiItems
        tuỳ ItemType) nên KHÔNG có khoá ngoại — đó là cái giá phải trả để một
        bộ thẻ chứa được cả từ vựng lẫn kanji, đúng như cách người ta học một
        bài: mấy chữ Hán mới đi kèm mấy từ mới. Ràng buộc toàn vẹn do tầng
        service giữ khi thêm thẻ vào bộ.
      changes:
        - createTable:
            tableName: DeckItems
            columns:
              - column:
                  name: DeckID
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_deckitem_deck
                    references: Decks(DeckID)
                    deleteCascade: true
              - column:
                  name: ItemType
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: ItemID
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: OrderNo
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: DeckItems
            columnNames: DeckID, ItemType, ItemID
            constraintName: PK_DeckItems

  - changeSet:
      id: v1.4.0-02-create-user-card-states
      author: team
      comment: >-
        Trạng thái ôn tập của MỘT người trên MỘT thẻ — trái tim của SRS.
        Cùng một thẻ với hai người học là hai dòng khác nhau, vì lịch ôn phụ
        thuộc vào việc từng người nhớ tới đâu chứ không phụ thuộc vào thẻ.
      changes:
        - createTable:
            tableName: UserCardStates
            columns:
              - column:
                  name: CardStateID
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: UserID
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_cardstate_user
                    references: Users(UserID)
                    deleteCascade: true
              - column:
                  name: ItemType
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: ItemID
                  type: INT
                  constraints:
                    nullable: false
              # Hệ số dễ của SM-2. Bắt đầu 2.50, không bao giờ xuống dưới 1.30.
              # Thẻ khó bị kéo hệ số xuống nên khoảng cách ôn giãn ra chậm hơn.
              # DECIMAL(4,2) là đủ chính xác: mọi bước điều chỉnh của SM-2
              # (-0.14 / 0 / +0.10) đều tròn hai chữ số thập phân.
              - column:
                  name: EaseFactor
                  type: DECIMAL(4,2)
                  defaultValueNumeric: 2.50
                  constraints:
                    nullable: false
              # Số ngày tới lần ôn kế tiếp. 0 = thẻ mới, chưa từng ôn.
              - column:
                  name: IntervalDays
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              # Số lần ôn đúng liên tiếp. Trả lời "Quên" là reset về 0.
              - column:
                  name: Repetitions
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              # Số lần đã quên. Không dùng để tính lịch, dùng để chỉ ra thẻ nào
              # cần đổi cách học thay vì cứ lặp lại mãi.
              - column:
                  name: Lapses
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              # Đến hạn ôn lúc nào. Thẻ mới đặt bằng thời điểm ghi danh nên
              # xuất hiện ngay trong hàng đợi hôm nay.
              - column:
                  name: DueAt
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: LastReviewedAt
                  type: DATETIME
              - column:
                  name: CreatedAt
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addUniqueConstraint:
            tableName: UserCardStates
            columnNames: UserID, ItemType, ItemID
            constraintName: UC_CardState_User_Item

        # Truy vấn chạy mỗi lần mở màn ôn thẻ:
        # WHERE UserID = ? AND DueAt <= NOW() ORDER BY DueAt
        - createIndex:
            tableName: UserCardStates
            indexName: idx_cardstate_user_due
            columns:
              - column:
                  name: UserID
              - column:
                  name: DueAt
