databaseChangeLog:
  # SỔ TAY CÂU SAI — §3.4(a) của revision_plan.md

  - changeSet:
      id: v1.4.0-01-create-mistake-entries
      author: team
      comment: "Sổ tay câu sai: mỗi (học sinh, câu hỏi) sai một dòng, kèm lịch ôn lại."
      changes:
        - createTable:
            tableName: MistakeEntries
            columns:
              - column:
                  name: MistakeID
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: UserID
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_mistake_user
                    references: Users(UserID)
                    deleteCascade: true
              - column:
                  name: QuestionID
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_mistake_question
                    references: Questions(QuestionID)
                    deleteCascade: true
              # Sai bao nhiêu lần từ trước tới nay. Càng cao thì càng nên ôn sớm.
              - column:
                  name: WrongCount
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              # Số lần trả lời đúng LIÊN TIẾP kể từ lần sai gần nhất.
              - column:
                  name: CorrectStreak
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: LastWrongAt
                  type: DATETIME
              # Mốc nên ôn lại. Giãn dần theo CorrectStreak, kéo gần lại mỗi lần sai.
              - column:
                  name: NextReviewAt
                  type: DATETIME
              # Khác NULL = đã thuộc, không hiện trong hàng đợi nữa.
              - column:
                  name: MasteredAt
                  type: DATETIME
              - column:
                  name: CreatedAt
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addUniqueConstraint:
            tableName: MistakeEntries
            columnNames: UserID, QuestionID
            constraintName: UC_Mistake_User_Question

        # Truy vấn nóng nhất: "câu đến hạn ôn của tôi" —
        # WHERE UserID = ? AND MasteredAt IS NULL ORDER BY NextReviewAt
        - createIndex:
            tableName: MistakeEntries
            indexName: idx_mistake_user_due
            columns:
              - column:
                  name: UserID
              - column:
                  name: MasteredAt
              - column:
                  name: NextReviewAt
