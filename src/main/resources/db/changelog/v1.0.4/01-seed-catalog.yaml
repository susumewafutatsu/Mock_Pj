databaseChangeLog:
  # ─────────────────────────────────────────────────────────────────
  # DỮ LIỆU DANH MỤC DÙNG CHUNG — CHẠY MẶC ĐỊNH (không có context).
  #
  # Khác v1.0.3 (dữ liệu mẫu, chỉ nạp khi bật context "demo"): file này
  # nạp cho MỌI người trong team để ai clone repo cũng có sẵn cùng một
  # bộ môn học / trình độ, không phải tự thêm tay và không lệch LevelID
  # giữa các máy.
  #
  # Vì sao phải seed: tạo lớp (POST /api/teacher/classes) và tạo đề thi
  # (POST /api/teacher/exams) đều bắt buộc LevelID có thật, mà màn hình
  # admin để khai môn học / trình độ thì chưa làm. Seed ở đây là chỗ
  # thay thế cho màn hình đó cho tới khi nó có.
  #
  # ID cố định trong dải 1..99 để mọi máy trong team dùng cùng con số
  # (dải 9001+ đã thuộc dữ liệu demo). Khi giáo viên tự thêm môn mới qua
  # UI về sau, AUTO_INCREMENT tiếp tục từ số lớn nhất nên không đụng nhau.
  # ─────────────────────────────────────────────────────────────────

  - changeSet:
      id: v1.0.4-01-seed-subject-japanese
      author: team
      comment: "Môn Tiếng Nhật — môn học chính của hệ thống."
      # Máy nào đã tự thêm tay môn/ID này trước đó thì bỏ qua changeSet cho khỏi
      # vướng UNIQUE(SubjectName) hoặc trùng khoá chính, không làm app fail lúc khởi động.
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM Subjects WHERE SubjectID = 1 OR SubjectName = 'Tiếng Nhật'
      changes:
        - insert:
            tableName: Subjects
            columns:
              - column: { name: SubjectID, valueNumeric: 1 }
              - column: { name: SubjectName, value: "Tiếng Nhật" }
              - column: { name: Description, value: "Tiếng Nhật theo khung năng lực JLPT" }
      rollback:
        - delete:
            tableName: Subjects
            where: SubjectID = 1

  - changeSet:
      id: v1.0.4-01-seed-jlpt-levels
      author: team
      comment: "5 trình độ JLPT N5→N1 của môn Tiếng Nhật. DisplayOrder xếp từ dễ đến khó."
      # Chỉ nạp khi môn Tiếng Nhật là đúng bản seed ở trên (SubjectID = 1) và
      # chưa có trình độ nào trong dải 1..5, tránh trùng UC_Subject_Level.
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) FROM Subjects WHERE SubjectID = 1
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM SubjectLevels WHERE LevelID BETWEEN 1 AND 5 OR SubjectID = 1
      changes:
        - insert:
            tableName: SubjectLevels
            columns:
              - column: { name: LevelID, valueNumeric: 1 }
              - column: { name: SubjectID, valueNumeric: 1 }
              - column: { name: LevelName, value: "N5" }
              - column: { name: Description, value: "Sơ cấp — khoảng 800 từ, 100 chữ Hán" }
              - column: { name: DisplayOrder, valueNumeric: 1 }
        - insert:
            tableName: SubjectLevels
            columns:
              - column: { name: LevelID, valueNumeric: 2 }
              - column: { name: SubjectID, valueNumeric: 1 }
              - column: { name: LevelName, value: "N4" }
              - column: { name: Description, value: "Sơ trung cấp — khoảng 1.500 từ, 300 chữ Hán" }
              - column: { name: DisplayOrder, valueNumeric: 2 }
        - insert:
            tableName: SubjectLevels
            columns:
              - column: { name: LevelID, valueNumeric: 3 }
              - column: { name: SubjectID, valueNumeric: 1 }
              - column: { name: LevelName, value: "N3" }
              - column: { name: Description, value: "Trung cấp — khoảng 3.700 từ, 650 chữ Hán" }
              - column: { name: DisplayOrder, valueNumeric: 3 }
        - insert:
            tableName: SubjectLevels
            columns:
              - column: { name: LevelID, valueNumeric: 4 }
              - column: { name: SubjectID, valueNumeric: 1 }
              - column: { name: LevelName, value: "N2" }
              - column: { name: Description, value: "Trung cao cấp — khoảng 6.000 từ, 1.000 chữ Hán" }
              - column: { name: DisplayOrder, valueNumeric: 4 }
        - insert:
            tableName: SubjectLevels
            columns:
              - column: { name: LevelID, valueNumeric: 5 }
              - column: { name: SubjectID, valueNumeric: 1 }
              - column: { name: LevelName, value: "N1" }
              - column: { name: Description, value: "Cao cấp — khoảng 10.000 từ, 2.000 chữ Hán" }
              - column: { name: DisplayOrder, valueNumeric: 5 }
      rollback:
        - delete:
            tableName: SubjectLevels
            where: SubjectID = 1
