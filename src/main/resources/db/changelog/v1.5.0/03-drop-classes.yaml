databaseChangeLog:
  # XOÁ MÔ HÌNH LỚP HỌC

  - changeSet:
      id: v1.5.0-03-drop-exam-class-column
      author: team
      comment: "Bỏ Exams.ClassID — quan hệ đề ↔ phòng giờ đi qua RoomExams."
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: Exams
            columnName: ClassID
      changes:
        - dropForeignKeyConstraint:
            baseTableName: Exams
            constraintName: fk_exam_class
        - dropColumn:
            tableName: Exams
            columnName: ClassID
      rollback:
        - addColumn:
            tableName: Exams
            columns:
              - column:
                  name: ClassID
                  type: INT

  - changeSet:
      id: v1.5.0-03-drop-class-tables
      author: team
      comment: "Xoá ClassStudents rồi Classes. Thứ tự bắt buộc: bảng con trước."
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: Classes
      changes:
        - dropTable:
            tableName: ClassStudents
        - dropTable:
            tableName: Classes
      rollback:
        # Chỉ dựng lại khung rỗng — xem cảnh báo ở đầu file.
        - createTable:
            tableName: Classes
            columns:
              - column:
                  name: ClassID
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ClassName
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: CourseCode
                  type: VARCHAR(20)
              - column:
                  name: TeacherID
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: LevelID
                  type: INT
              - column:
                  name: GoogleClassroomID
                  type: VARCHAR(100)
              - column:
                  name: CreatedAt
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createTable:
            tableName: ClassStudents
            columns:
              - column:
                  name: ClassID
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: StudentID
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: JoinedAt
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
