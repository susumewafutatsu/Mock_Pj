databaseChangeLog:
  # ─────────────────────────────────────────────────────────────────
  # XOÁ MÔ HÌNH LỚP HỌC
  #
  # ĐÂY LÀ FILE KHÔNG LÙI ĐƯỢC. Chỉ chạy sau khi đã kiểm dữ liệu ở
  # v1.5.0/02 chuyển sang đúng. Cách kiểm nhanh trước khi cho chạy:
  #
  #   SELECT (SELECT COUNT(*) FROM Classes)       AS lop_cu,
  #          (SELECT COUNT(*) FROM Rooms)         AS phong_moi,
  #          (SELECT COUNT(*) FROM ClassStudents) AS hoc_sinh_cu,
  #          (SELECT COUNT(*) FROM RoomMembers)   AS thanh_vien_moi,
  #          (SELECT COUNT(*) FROM Exams WHERE ClassID IS NOT NULL) AS de_gan_lop,
  #          (SELECT COUNT(*) FROM RoomExams)     AS de_gan_phong;
  #
  # Hai cặp đầu phải bằng nhau từng cặp, cặp cuối cũng vậy. Lệch là dừng,
  # đừng chạy tiếp.
  #
  # Rollback ở đây chỉ dựng lại KHUNG bảng rỗng, KHÔNG khôi phục dữ liệu.
  # Muốn quay lại thật thì phải phục hồi từ bản sao lưu — nói thẳng ra ở
  # đây còn hơn để ai đó tin vào một lệnh rollback không làm được việc.
  # ─────────────────────────────────────────────────────────────────

  - changeSet:
      id: v1.5.0-03-drop-exam-class-column
      author: team
      comment: "Bỏ Exams.ClassID — quan hệ đề ↔ phòng giờ đi qua RoomExams."
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: Exams
            columnName: ClassID
      changes:
        - dropForeignKeyConstraint:
            baseTableName: Exams
            constraintName: fk_exam_class
        - dropColumn:
            tableName: Exams
            columnName: ClassID
      rollback:
        - addColumn:
            tableName: Exams
            columns:
              - column:
                  name: ClassID
                  type: INT

  - changeSet:
      id: v1.5.0-03-drop-class-tables
      author: team
      comment: "Xoá ClassStudents rồi Classes. Thứ tự bắt buộc: bảng con trước."
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: Classes
      changes:
        - dropTable:
            tableName: ClassStudents
        - dropTable:
            tableName: Classes
      rollback:
        # Chỉ dựng lại khung rỗng — xem cảnh báo ở đầu file.
        - createTable:
            tableName: Classes
            columns:
              - column:
                  name: ClassID
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ClassName
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: CourseCode
                  type: VARCHAR(20)
              - column:
                  name: TeacherID
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: LevelID
                  type: INT
              - column:
                  name: GoogleClassroomID
                  type: VARCHAR(100)
              - column:
                  name: CreatedAt
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createTable:
            tableName: ClassStudents
            columns:
              - column:
                  name: ClassID
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: StudentID
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: JoinedAt
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
