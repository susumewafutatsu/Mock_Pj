databaseChangeLog:
  # SỬA LỆCH QUY ƯỚC ĐẶT TÊN CỦA BẢNG TAGS.

  - changeSet:
      id: v1.1.0-02-rename-questiontags-back
      author: team
      comment: "Đổi question_tags trở lại QuestionTags cho khớp @JoinTable trong Question.java"
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: question_tags
      changes:
        - renameTable:
            oldTableName: question_tags
            newTableName: QuestionTags

  - changeSet:
      id: v1.1.0-02-rename-tags-columns-back
      author: team
      comment: "Đổi tags.tag_name / tags.created_at trở lại TagName / CreatedAt"
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: Tags
            columnName: tag_name
      changes:
        - renameColumn:
            tableName: Tags
            oldColumnName: tag_name
            newColumnName: TagName
            columnDataType: VARCHAR(50)
        - renameColumn:
            tableName: Tags
            oldColumnName: created_at
            newColumnName: CreatedAt
            columnDataType: DATETIME
        # MySQL CHANGE COLUMN làm mất NOT NULL / DEFAULT nên khai báo lại
        - addNotNullConstraint:
            tableName: Tags
            columnName: TagName
            columnDataType: VARCHAR(50)
        - addDefaultValue:
            tableName: Tags
            columnName: CreatedAt
            columnDataType: DATETIME
            defaultValueComputed: CURRENT_TIMESTAMP
