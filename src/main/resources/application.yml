server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/mockpj?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Hibernate chỉ kiểm tra schema. Liquibase quản lý schema.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# ── Google SSO: nơi backend redirect kèm JWT sau khi login xong ─
app:
  oauth2:
    default-redirect-uri: http://localhost:5173/auth/callback
    login-failure-uri: http://localhost:5173/login
    authorized-redirect-uris: http://localhost:5173/auth/callback,http://127.0.0.1:5173/auth/callback,http://localhost:3000/auth/callback

# ── JWT Configuration ──────────────────────────────────────────
jwt:
  secret: your-256-bit-secret-key-change-this-in-production-use-64-characters-for-better-security
  expiration-ms: 86400000        
  refresh-expiration-ms: 604800000  

# ── Swagger UI ─────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs