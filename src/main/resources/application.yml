server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    org.springframework.security: DEBUG

spring:
  servlet:
    # File nghe 聴解 tối đa 20 MB (MediaController cũng tự kiểm lại).
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/mockpj?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Hibernate chỉ kiểm tra schema. Liquibase quản lý schema.
      ddl-auto: validate
      naming:
        # Mặc định của Spring Boot là CamelCaseToUnderscoresNamingStrategy.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    # Danh mục dùng chung (môn học Tiếng Nhật + trình độ N5→N1) nằm ở db/changelog/v1.0.4/01-seed-catalog.yaml.
    contexts: ${LIQUIBASE_CONTEXTS:demo}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Timeout PHẢI ngắn. Redis ở đây chỉ là lớp tăng tốc.
      timeout: 1s
      connect-timeout: 1s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 500ms

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# ── Google SSO: nơi backend redirect kèm JWT sau khi login xong ─
app:
  # Thư mục lưu file tải lên (audio). Chạy nhiều máy chủ thì đổi sang kho đối tượng.
  upload-dir: ${UPLOAD_DIR:uploads}
  oauth2:
    default-redirect-uri: http://localhost:5173/auth/callback
    login-failure-uri: http://localhost:5173/login
    authorized-redirect-uris: http://localhost:5173/auth/callback,http://127.0.0.1:5173/auth/callback,http://localhost:3000/auth/callback

# ── JWT Configuration ──────────────────────────────────────────
jwt:
  secret: your-256-bit-secret-key-change-this-in-production-use-64-characters-for-better-security
  expiration-ms: 86400000        
  refresh-expiration-ms: 604800000  

# ── Phiên làm bài của thí sinh ─────────────────────────────────
exam:
  session:
    # Chu kỳ job quét các phiên đã quá ExpiresAt để nộp hộ.
    auto-submit-interval-ms: 30000
    # Chu kỳ job đánh dấu AtRiskStatus.
    at-risk-scan-interval-ms: 30000
    # Im lặng quá bao lâu thì coi là mất kết nối.
    at-risk-after-seconds: 90

  # Phần Redis gánh hộ MySQL Redis KHÔNG giữ bài làm hay điểm — những thứ đó nằm trong MySQL.
  redis:
    # Đề thi đã snapshot được cache bao lâu.
    paper-ttl-seconds: 600
    # Khoá chống tạo hai phiên cho cùng một thí sinh.
    start-lock-seconds: 10
    # Bao lâu mới ghi LastActiveAt xuống MySQL một lần.
    last-active-flush-seconds: 30

# ── Nghiệp vụ học tập (revision_plan.md §3.4) ──────────────────
study:
  srs:
    # Trần số thẻ cho một phiên ôn.
    daily-limit: 100
    # Số thẻ mới mở mỗi ngày.
    new-per-day: 20
    # Trần số thẻ nạp vào lịch trong một lần ghi danh bộ thẻ.
    max-enroll-per-deck: 500

# ── Import câu hỏi từ PDF/Word bằng Gemini ──────────────────────
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-flash-latest}
  base-url: https://generativelanguage.googleapis.com
  # Số câu hỏi tối đa sinh trong một lần import, tránh lạm dụng.
  max-questions-per-request: 20

# ── Swagger UI ─────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs