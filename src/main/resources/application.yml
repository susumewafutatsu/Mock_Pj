server:
  port: 8080

spring:
  application:
    name: online-testing-platform
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=TestingPlatformDB;encrypt=true;trustServerCertificate=true;
    username: sa
    password: YourPassword123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect