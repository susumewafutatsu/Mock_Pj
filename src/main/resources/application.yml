server:
  port: 8080

spring:
  application:
    name: online-testing-platform

  # ── Database (MySQL) ───────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/TestingPlatformDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: YourPassword123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update        # tự tạo/update bảng theo Entity
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # ── Redis (Session & Cache) ────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      # password:           # bỏ comment nếu Redis có password

  # ── OAuth2 Google SSO ──────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_GOOGLE_CLIENT_ID
            client-secret: YOUR_GOOGLE_CLIENT_SECRET
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# ── JWT ────────────────────────────────────────────────────────
jwt:
  secret: your-256-bit-secret-key-change-this-in-production
  expiration-ms: 86400000        # 24 giờ
  refresh-expiration-ms: 604800000  # 7 ngày

# ── Gemini AI API ──────────────────────────────────────────────
gemini:
  api:
    key: YOUR_GEMINI_API_KEY
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent

# ── Swagger UI ─────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs