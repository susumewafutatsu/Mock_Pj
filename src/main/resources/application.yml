# src/main/resources/application.yml
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mockpj?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: hbnguyen
    password: "042311"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        #dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_GOOGLE_CLIENT_ID
            client-secret: YOUR_GOOGLE_CLIENT_SECRET
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# ── JWT Configuration ──────────────────────────────────────────
jwt:
  secret: your-256-bit-secret-key-change-this-in-production-use-64-characters-for-better-security
  expiration-ms: 86400000        # 24 giờ
  refresh-expiration-ms: 604800000  # 7 ngày

# ── Swagger UI ─────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs